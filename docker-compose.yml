services: #띄울 컨테이너 목록
  db: 
    image: pgvector/pgvector:pg16 #POSTGERSQL 16에 pgvector가 들어있는 공식 이미지
    env_file: .env #env 읽음 처음 켤 때 그 이름으로 DB와 사용자 생성
    ports: #"내 컴퓨터 포트:컨테이너 포트" Django가 localhost:5432로 접속할 수 있게 함
      - "5432:5432"
    volumes: # DB데이터를 컨테이너 "밖"에 저장함 없을 시 컨테이너를 지울 때 수집한 데이터도 같이 사라짐
      - pgdata:/var/lib/postgresql/data
    healthcheck: #5초마다 DB가 접속 받을 준비가 됐는지 확인함 $$는 compose가 $를 직접 해석 X 컨테이너 안에 넘기라는 표시 
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGERS_DB}"]
      interval: 5s
      retries: 10


  redis:
    image: redis:7 #redis의 공식 이미지 
    ports:
      - "6379:6379"
volumes: #pgdata 저장 공간을 docker가 관리 및 선언 
  pgdata: